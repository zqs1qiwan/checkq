name: Bug 报告
description: 报告一个可复现的缺陷（使用问题请走 Discussions / 文档站）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索现有 Issue，确认不是重复问题。
        安全漏洞请不要用公开 Issue 报告，详见仓库 `docs/SECURITY.md`。
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 Issue，没有相同问题
          required: true
        - label: 已阅读文档站中的使用与排障说明
          required: true
  - type: input
    id: version
    attributes:
      label: CheckQ 版本
      description: 设置 → 关于，或 `GET /api/health` 返回的版本号
      placeholder: 0.6.4
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - Docker Compose（仓库自带 compose 文件）
        - 预构建镜像 / 其它 Docker 方式
        - 本地源码运行
        - 其它
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、浏览器、Node 版本、反向代理等
      placeholder: Windows 11 / Chrome 130 / Node 22 / nginx 反代
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 尽量具体到可重复操作
      placeholder: |
        1. 新建任务并添加 HTTP 步骤
        2. 运行任务
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 包含错误提示、诊断卡原因、HTTP 状态码等可观测证据
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: 运行日志（已脱敏）、浏览器控制台报错、截图或录屏。请自行确认不含真实凭据
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 是否与特定站点、插件、数据规模或升级路径相关
  - type: checkboxes
    id: sanitize
    attributes:
      label: 隐私确认
      options:
        - label: 已移除日志与截图中的真实 Cookie、Token、密码和站点地址
          required: true
