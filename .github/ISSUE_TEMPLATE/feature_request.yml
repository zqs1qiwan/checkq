name: 功能请求
description: 提出新功能或改进建议（请先说明使用场景与当前替代做法）
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索现有 Issue 与 `docs/ROADMAP.md`，确认不是已有计划。
        本项目不内置浏览器渲染、验证码识别与集群能力，这类请求请说明为什么必须内置。
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 Issue 与 ROADMAP，没有相同建议
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述具体场景与当前卡点，不要只写功能名
      placeholder: 我有 30 个任务需要按分组批量改通知渠道，现在只能逐个打开...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的界面或 API 形态、关键交互与默认值
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代做法
      description: 现在如何绕过，成本是什么
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - 可视化编辑器 / 画布
        - 任务、模板与批量操作
        - 调度、重试与恢复
        - 运行日志与诊断
        - 通知渠道
        - 账号、权限与 API Key
        - REST API / OpenAPI
        - MCP server
        - 部署与文档
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、竞品做法、兼容性要求等
  - type: checkboxes
    id: willing
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现这个建议
